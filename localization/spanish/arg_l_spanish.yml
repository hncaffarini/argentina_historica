l_spanish:
 argentina_events.1.t: "La Cuestión Migratoria"
 argentina_events.1.d: "Nuestros pensadores debaten si el progreso de la nación depende de atraer brazos de Europa."
 argentina_events.1.f: "Gobernar es poblar."
 argentina_events.1.a: "Fomentar la llegada de inmigrantes."
 argentina_events.1.b: "Priorizar el orden interno."

 # --- 1836 ---
 arg_ley_de_aduanas.t: "El Monopolio de la Aduana"
 arg_ley_de_aduanas.d: "Desde la caída del gobierno central, la #v $arg_loc_aduana$#! ha permanecido bajo el control exclusivo de Buenos Aires. El gobernador #v $arg_loc_rosas$#! sostiene que estas rentas pertenecen legítimamente a su provincia, pero las #v $arg_loc_provincias$#! exigen que los ingresos se repartan o que se permita la libre navegación de los ríos."
 arg_ley_de_aduanas.f: "«Buenos Aires es la puerta de la tierra, y tiene la llave en su mano». — Observación de la época."

 arg_ley_de_aduanas.a: "Defender el privilegio de Buenos Aires."
 arg_ley_de_aduanas.a.tt: "Históricamente, Rosas mantuvo este monopolio, lo que financió su ejército pero generó constantes rebeliones en el litoral."

 arg_ley_de_aduanas.b: "Nacionalizar las rentas del puerto."
 arg_ley_de_aduanas.b.tt: "Esto debilitará el poder de Buenos Aires pero fortalecerá la unidad nacional de forma prematura."

 arg_evento_mazorca.t: "La Sociedad Popular Restauradora"
 arg_evento_mazorca.d: "Las calles de Buenos Aires ya no son seguras para los críticos del gobierno. #v $arg_loc_mazorca$#! ha intensificado sus rondas, asegurando que cada ciudadano porte el distintivo punzó y profiera las consignas federales. Aquellos sospechosos de simpatías unitarias enfrentan el azote o algo peor."
 arg_evento_mazorca.a: "El orden requiere firmeza."


 # --- 1837 ---
 arg_guerra_peru_boliviana.t: "Guerra en el Norte"
 arg_guerra_peru_boliviana.d: "La ambición de #v $arg_loc_santa_cruz$#! ha dado sus frutos: Perú y Bolivia se han unido en una sola confederación. Esta nueva potencia amenaza la estabilidad de nuestras provincias del norte y la soberanía sobre Tarija. El gobernador #v $arg_loc_alejandro_heredia$#! solicita apoyo para movilizar las milicias y defender la Confederación Argentina."
 arg_guerra_peru_boliviana.f: "«Ningún argentino puede ver con indiferencia la formación de un poder que busca absorber a sus vecinos». — Nota diplomática de la época."
 
 arg_guerra_peru_boliviana.a: "Movilizar al Ejército del Norte."
 arg_guerra_peru_boliviana.b: "Evitar una guerra costosa."

 # --- 1838 ---
 arg_bloqueo_frances.t: "El Ultimátum del $arg_loc_almirante_leblanc$"
 arg_bloqueo_frances.d: "La flota francesa ha aparecido frente a nuestras costas. El #v $arg_loc_almirante_leblanc$#! exige que nuestros ciudadanos franceses sean eximidos del servicio militar y reclama reparaciones por supuestos agravios. De no aceptar, Francia iniciará un #v $arg_loc_bloqueo_frances$#! que impedirá cualquier actividad en el puerto de Buenos Aires."
 arg_bloqueo_frances.f: "«La Francia no tiene interés en hacer la guerra a la Confederación, pero tiene el derecho de ser respetada». — Almirante Le Blanc."
 
 arg_bloqueo_frances.a: "¡No aceptaremos imposiciones extranjeras!"
 arg_bloqueo_frances.b: "Ceder para evitar la ruina económica."

 arg_darwin_fosiles.t: "Los Gigantes del Pasado"
 arg_darwin_fosiles.d: "Científicos y viajeros europeos, maravillados por la geografía de nuestras pampas, han reportado el hallazgo de huesos de proporciones colosales. Estos #v $arg_loc_paleontologia$#! desafían la comprensión actual del mundo natural. Algunos sugieren crear un espacio para su estudio en Buenos Aires."
 arg_darwin_fosiles.a: "Fomentar la curiosidad científica."

 # --- 1839 ---
 arg_libres_del_sur.t: "La Revolución de los $arg_loc_libres_del_sur$"
 arg_libres_del_sur.d: "La asfixia económica causada por el bloqueo ha llegado a su límite. En los campos de Chascomús y Dolores, un grupo de estancieros liderados por #v $arg_loc_pedro_castelli$#! se ha alzado en armas. Denuncian que la intransigencia de Rosas está arruinando la industria ganadera y exigen el fin de las hostilidades con Francia."
 arg_libres_del_sur.f: "«Libertad o muerte, no hay más camino para los hijos de mayo». — Consigna de los sublevados."
 
 arg_libres_del_sur.a: "Enviar a la Mazorca a restaurar el orden."
 arg_libres_del_sur.b: "Ofrecer concesiones a los estancieros del sur."

 # --- 1840 ---
 arg_coalicion_norte.t: "La Liga de las Provincias del Norte"
 arg_coalicion_norte.d: "Las provincias de Salta, Jujuy, Tucumán, Catamarca y La Rioja han firmado un acta de rebelión. Bajo el liderazgo de #v $arg_loc_marco_avellaneda$#!, la #v $arg_loc_coalicion_norte$#! desconoce la autoridad de Rosas y exige una Constitución Nacional. El orden federal en el interior se está desmoronando y los ejércitos rebeldes comienzan a marchar hacia el sur."
 arg_coalicion_norte.f: "«La tiranía de Buenos Aires no tiene más límites que nuestra paciencia». — Manifiesto de la Coalición."
 
 arg_coalicion_norte.a: "Enviar al General Oribe a pacificar el Norte."
 arg_coalicion_norte.b: "Enviar emisarios con oro para dividir a los rebeldes."

 # --- 1841 ---
 arg_fiestas_mayas_1841.t: "Las $arg_loc_fiestas_mayas$"
 arg_fiestas_mayas_1841.d: "Buenos Aires se viste de color punzó. Entre desfiles, bailes populares y el estallido de cohetes, el pueblo celebra la Revolución de Mayo. Rosas aprovecha la ocasión para reafirmar la unidad federal bajo su mando y repartir carne entre los más necesitados."
 arg_fiestas_mayas_1841.f: "«¡Viva la Confederación Argentina! ¡Mueran los salvajes unitarios!» — Consigna obligatoria en las celebraciones."
 arg_fiestas_mayas_1841.a: "¡Que continúe el festejo popular!"

 arg_herencia_guemes.t: "Los Herederos de Güemes"
 arg_herencia_guemes.d: "En las provincias del Norte, el recuerdo de #v $arg_loc_guemes$#! sigue siendo el motor de las milicias locales. Los gauchos de Salta y Jujuy, que una vez frenaron a los realistas, hoy forman la vanguardia de nuestras defensas. Se dice que mientras un gaucho recuerde al 'Padre de los Pobres', la frontera norte estará segura."
 arg_herencia_guemes.a: "Honrar la memoria del Protector del Norte."

 arg_venta_tierras.t: "La Propiedad de la Tierra"
 arg_venta_tierras.d: "Para financiar las guerras contra la Coalición del Norte y el Bloqueo Francés, el gobierno ha decidido terminar con la #v $arg_loc_ley_enfiteusis$#!. Las tierras públicas ahora serán vendidas a los actuales arrendatarios, transformando a los enfiteutas en propietarios absolutos."

 arg_venta_tierras.a: "Consolidar la clase terrateniente."
 # --- 1842 ---
 arg_batalla_arroyo_grande.t: "Victoria en $arg_loc_batalla_arroyo_grande$"
 arg_batalla_arroyo_grande.d: "Las fuerzas de la Confederación, al mando del General Manuel Oribe, han aniquilado al ejército de Fructuoso Rivera. Con esta victoria, el camino hacia Montevideo queda abierto. Rosas consolida su dominio sobre el Río de la Plata, desafiando las pretensiones de los unitarios y sus aliados extranjeros."
 arg_batalla_arroyo_grande.f: "«¡El triunfo es completo! No queda enemigo organizado en la campaña». — Parte de guerra federal."
 arg_batalla_arroyo_grande.a: "Asegurar nuestra hegemonía regional."

 arg_vida_pulperia.t: "Entre Guitarras y Facones"
 arg_vida_pulperia.d: "En cada rincón de nuestras provincias, #v $arg_loc_pulperias$#! sirven como el único nexo entre la civilización y el desierto. Allí, el gaucho bebe, canta cielitos y reafirma su lealtad al federalismo o a su caudillo local. Controlar estos espacios es controlar el pulso del país rural."

 arg_vida_pulperia.a: "Asegurar la lealtad de los paisanos."
 # --- 1843 ---
 arg_revista_la_moda.t: "La Elegancia y $arg_loc_la_moda$"
 arg_revista_la_moda.d: "A pesar de la rigidez política, en los salones porteños circula la revista #v La Moda#!. Bajo el pretexto de hablar de vestimenta y música, los jóvenes de la #v Generación del 37#! deslizan ideas sobre la libertad y el futuro de la nación. ¿Debemos permitir estos espacios de debate o verlos como focos de traición?"
 arg_revista_la_moda.f: "«Seamos elegantes, pero también seamos pensadores». — Editorial de La Moda."
 arg_revista_la_moda.a: "Permitir los salones literarios."
 arg_revista_la_moda.b: "Prohibir cualquier tertulia sospechosa."

 # --- 1844 ---
 arg_terremoto_salta.t: "Tragedia en el Norte: El $arg_loc_terremoto_salta$"
 arg_terremoto_salta.d: "La tierra ha temblado violentamente en el Norte. La ciudad de Salta ha sufrido daños considerables en sus templos y viviendas. Los ciudadanos, aterrados, han sacado las imágenes del Señor y la Virgen del Milagro en procesión, implorando el fin de la catástrofe."
 arg_terremoto_salta.f: "«La ciudad parece un cementerio de escombros, el dolor es inmenso». — Crónica de un sobreviviente."
 arg_terremoto_salta.a: "Destinar fondos del tesoro para Salta."
 arg_terremoto_salta.b: "Confiar en la resiliencia del pueblo salteño."

 arg_emision_moneda.t: "La Prensa de la $arg_loc_casa_moneda$"
 arg_emision_moneda.d: "Las arcas están vacías tras años de bloqueos. La #v $arg_loc_casa_moneda$#! ha recibido la orden de imprimir nuevas series de billetes para cubrir los gastos militares. El valor del peso frente a la onza de oro cae estrepitosamente, encareciendo los productos importados."

 arg_emision_moneda.a: "Es un mal necesario para la guerra."
 # --- 1845 ---
 arg_vuelta_obligado.t: "Las Cadenas de la $arg_loc_vuelta_obligado$"
 arg_vuelta_obligado.d: "Una imponente flota de vapores de guerra británicos y franceses avanza por el río Paraná, desafiando nuestra prohibición de navegar los ríos interiores. En el paso de Obligado, el general #v $arg_loc_lucio_mansilla$#! ha dispuesto baterías de artillería y cruzado tres pesadas cadenas para detenerlos. Es una lucha desigual: madera y coraje contra hierro y vapor."
 arg_vuelta_obligado.f: "«¡Vedlos, camaradas, allí los tenéis! Considerad el tamaño del insulto que vienen haciendo a la soberanía de nuestra patria». — Lucio N. Mansilla."
 arg_vuelta_obligado.a: "¡Fuego a discreción! ¡Defiendan el río!"
 arg_vuelta_obligado.b: "Es inútil resistir a las potencias mundiales."

 arg_serenos_ba.t: "¡Todo Sereno!"
 arg_serenos_ba.d: "Al caer el sol, la ciudad de Buenos Aires queda bajo el cuidado de los #v $arg_loc_serenos$#!. Con sus lanzas y faroles, recorren las calles de barro asegurando que el orden federal no sea perturbado. Sus gritos marcan las horas y el estado del tiempo, siendo un consuelo para los vecinos honestos y una advertencia para los malhechores."

 arg_serenos_ba.a: "La ciudad duerme tranquila."
 # --- 1846 ---
 arg_facundo_sarmiento.t: "Civilización o Barbarie"
 arg_facundo_sarmiento.d: "Desde su exilio en Chile, el sanjuanino #v $arg_loc_sarmiento$#! ha publicado su obra más ambiciosa: #v $arg_loc_facundo$#!. En sus páginas, describe la pampa como un escenario de lucha entre el progreso urbano y el atraso del desierto. El libro está circulando clandestinamente en Buenos Aires, encendiendo los ánimos de aquellos que sueñan con una organización nacional diferente."
 arg_facundo_sarmiento.f: "«¡Sombra de Quiroga, voy a evocarte, para que sacudiendo el ensangrentado polvo que cubre tus cenizas, te levantes a explicarnos la vida secreta y las convulsiones internas que desgarran las entrañas de un noble pueblo!» — D. F. Sarmiento."
 arg_facundo_sarmiento.a: "Una obra que definirá el pensamiento argentino."

 # --- 1847 ---
 arg_muelle_pasajeros.t: "El Puerto y $arg_loc_muelles_ba$"
 arg_muelle_pasajeros.d: "Buenos Aires, la gran capital de la Confederación, carece de un muelle digno. Los diplomáticos y comerciantes extranjeros se asombran al tener que desembarcar en carretas tiradas por bueyes en medio del barro del Río de la Plata. Se ha presentado un proyecto para construir un muelle de madera que facilite el tráfico de personas y bienes."
 arg_muelle_pasajeros.f: "«Es un espectáculo singular ver a los caballeros y damas llegar a tierra firme sobre los hombros de un carretero o en el fondo de un carro pesado». — Relato de un viajero inglés."
 arg_muelle_pasajeros.a: "Modernizar los accesos a la ciudad."
 arg_muelle_pasajeros.b: "No hay fondos para tales lujos."

 # --- 1848 ---
 arg_camila_ogorman.t: "El Escándalo de $arg_loc_camila_ogorman$"
 arg_camila_ogorman.d: "La sociedad de la Confederación está conmocionada. #v $arg_loc_camila_ogorman$#! y el sacerdote #v $arg_loc_ladislao_gutierrez$#! han sido capturados en Corrientes tras meses de fuga. Tanto la oposición unitaria desde el exilio como los sectores más conservadores de la Iglesia exigen un castigo ejemplar para este 'crimen contra la moral y el orden'. Rosas debe decidir si aplica la pena de muerte o muestra clemencia ante el ruego de las familias."
 arg_camila_ogorman.f: "«Han buscado su propia ruina desafiando las leyes de Dios y del Estado». — Opinión en el entorno federal."
 arg_camila_ogorman.a: "Ejecutar la sentencia para preservar el orden público."
 arg_camila_ogorman.b: "Conmutar la pena y enviarlos al destierro."

 # --- 1849 ---
 arg_tratado_arana_southern.t: "El $arg_loc_tratado_arana_southern$"
 arg_tratado_arana_southern.d: "La perseverancia ha dado sus frutos. Tras años de conflicto, el enviado británico Henry Southern ha firmado junto a nuestro ministro #v $arg_loc_felipe_arana$#! un tratado definitivo de paz. El Reino Unido reconoce que la navegación del río Paraná es un asunto interno de la Confederación Argentina y saluda a nuestro pabellón con 21 cañonazos. Es un reconocimiento histórico a nuestra soberanía."
 arg_tratado_arana_southern.f: "«La Gran Bretaña reconoce ser la navegación del Río Paraná una navegación interior de la Confederación Argentina». — Artículo IV del Tratado."
 arg_tratado_arana_southern.a: "¡Victoria diplomática para la Confederación!"

 # --- 1850 ---
 arg_muerte_san_martin.t: "El Fallecimiento del Gran Libertador"
 arg_muerte_san_martin.d: "Desde Francia llega la noticia que entristece a todo el continente: #v $arg_loc_san_martin$#! ha fallecido. El hombre que cruzó los Andes y dio la libertad a medio mundo ha muerto en la sencillez de su exilio. En su testamento, ha dejado una última voluntad que sacude la política local: la entrega de su #v $arg_loc_sable_corvo$#! al gobernador Rosas, como prueba de su admiración por la defensa del territorio nacional frente a los bloqueos extranjeros."
 arg_muerte_san_martin.f: "«El sable que me ha acompañado en toda la guerra de la Independencia de la América del Sud, le será entregado al General de la República Argentina, Don Juan Manuel de Rosas». — Testamento de San Martín."
 arg_muerte_san_martin.a: "Luto nacional por el Padre de la Patria."

 arg_batalla_caseros.1.t: "La Batalla de Caseros"
 arg_batalla_caseros.1.d: "El #v $arg_loc_ejercito_grande$#! ha derrotado a las fuerzas federales en los campos de Caseros. Juan Manuel de Rosas ha firmado su renuncia y se encamina al exilio en un buque británico. Una nueva era comienza para la nación: la era de la Constitución."
 arg_batalla_caseros.1.a: "Termina una época. Comienza la Organización Nacional."

 arg_secesion_buenos_aires.t: "La Revolución del 11 de Septiembre"
 arg_secesion_buenos_aires.d: "La tensión entre el General Urquiza y la élite porteña ha estallado. Liderados por Valentín Alsina y Bartolomé Mitre, los bonaerenses han expulsado a las tropas federales y proclamado que Buenos Aires no se someterá a los dictados de Paraná. La nación ha quedado fracturada."
 arg_secesion_buenos_aires.a: "Buenos Aires se separa de la Confederación."

 arg_constitucion_1853.t: "¡Constitución y Libertad!"
 arg_constitucion_1853.d: "En la ciudad de Santa Fe, los congresistas han jurado finalmente la #v $arg_loc_constitucion_53$#!. Basada en las 'Bases' de #v $arg_loc_alberdi$#!, esta carta magna promete libertad de cultos, fomento a la inmigración y un sistema federal. Sin embargo, los representantes de Buenos Aires no han estado presentes."
 arg_constitucion_1853.a: "Gobernar es poblar. ¡Viva la República!"

 arg_tratado_francia.t: "La Paz con Francia"
 arg_tratado_francia.d: "Tras el éxito con los británicos, Francia finalmente ha aceptado que no puede doblegar nuestra voluntad. El Almirante Lepredour ha firmado el tratado que devuelve la isla Martín García y reconoce nuestra soberanía fluvial. ¡La Confederación ha vencido a las dos potencias!" 

 # --- 1851 ---
 arg_evento_pronunciamiento.t: "El $arg_loc_pronunciamiento$"
 arg_evento_pronunciamiento.d: "El general #v $arg_loc_urquiza$#! ha lanzado un desafío abierto. Al reasumir las facultades de Entre Ríos, ha roto el pacto de caballeros que sostenía a la Confederación. Con el apoyo del Brasil y los exiliados en Montevideo, se prepara para marchar sobre Buenos Aires. El sistema de Rosas se enfrenta a su prueba final."
 arg_evento_pronunciamiento.f: "«¡Muera el tirano Rosas! ¡Viva la libertad de las provincias!» — Grito de guerra del Litoral."
 arg_evento_pronunciamiento.a: "La suerte está echada."

 # --- 1854-1858 ---
 arg_primer_ferrocarril.t: "El Ferrocarril del Oeste"
 arg_primer_ferrocarril.d: "Se ha otorgado la concesión para construir la primera línea férrea del país. Buenos Aires busca modernizarse para demostrar su superioridad sobre el interior. La locomotora 'La Porteña' pronto silbará por nuestras tierras, cambiando para siempre el transporte de mercancías."
 arg_primer_ferrocarril.a: "El progreso no tiene vuelta atrás."
 arg_puerto_rosario_1855.t: "Rosario: La Llave del Interior"
 arg_puerto_rosario_1855.d: "Para contrarrestar el poder de Buenos Aires, el General Urquiza ha designado al #v $arg_loc_puerto_rosario$#! como puerto habilitado para el comercio exterior. Las mercaderías ya no necesitan pasar por las manos porteñas. Rosario florece, y los barcos de ultramar comienzan a remontar el Paraná en números nunca vistos."
 arg_puerto_rosario_1855.a: "Fomentar el comercio en el Litoral."
 arg_colonia_esperanza_evento.t: "La Semilla de la Esperanza"
 arg_colonia_esperanza_evento.d: "Bajo el lema de Alberdi 'Gobernar es poblar', un grupo de 200 familias suizas, alemanas y francesas ha llegado a Santa Fe para fundar #v $arg_loc_colonia_esperanza$#!. Es el primer experimento de colonización agrícola organizada. Si tienen éxito, el desierto pronto se convertirá en campos de trigo."
 arg_colonia_esperanza_evento.a: "Bienvenidos a su nueva patria."
 arg_luz_gas_1856.t: "La Noche se hace Día"
 arg_luz_gas_1856.d: "Para las fiestas mayas de este año, el gobierno de Buenos Aires ha inaugurado el alumbrado a gas en la Plaza de la Victoria. Mientras el interior sigue iluminándose con velas de sebo, la capital brilla con una luz blanca y moderna. Los ciudadanos pasean asombrados bajo los nuevos faroles, sintiéndose más cerca de París que nunca."
 arg_luz_gas_1856.a: "El progreso ilumina nuestro camino."
 arg_registros_poblacion.t: "Contar para Gobernar"
 arg_registros_poblacion.d: "Para organizar un estado moderno, primero debemos saber cuántos somos y qué producimos. Se han iniciado los primeros relevamientos estadísticos en las provincias de la Confederación. Los resultados son alarmantes: somos pocos para un territorio tan vasto."
 arg_registros_poblacion.a: "Invertir en el Departamento de Estadística."
 arg_primer_colon.t: "Ópera en el Plata"
 arg_primer_colon.d: "Se ha inaugurado el primer Teatro Colón en Buenos Aires. Con una capacidad para 2.500 personas y materiales importados de Europa, se convierte en el centro de la vida social de la élite porteña. La ópera y el drama europeo ahora tienen un hogar permanente, reforzando la identidad cosmopolita de la ciudad."
 arg_primer_colon.a: "Fomentar las artes y el refinamiento."
 arg_educacion_1858.t: "La Instrucción Pública"
 arg_educacion_1858.d: "En medio de la división política, surge una certeza: la República necesita ciudadanos instruidos. Se han destinado fondos para la creación de nuevas #v $arg_loc_reforma_educativa$#! en las capitales provinciales. Aunque el tesoro está exhausto por los gastos militares, la educación se ve como la única vía hacia el progreso."
 arg_educacion_1858.a: "Las letras son tan importantes como las espadas."

 arg_batalla_cepeda_1859.t: "El Trueno de $arg_loc_batalla_cepeda$"
 arg_batalla_cepeda_1859.d: "La paciencia de la Confederación se ha agotado. En los campos de Cepeda, el General Urquiza ha destrozado al ejército porteño de Mitre. Buenos Aires está sitiada y no tiene más opción que negociar su reincorporación. Sin embargo, los porteños son negociadores duros y exigirán revisar la Constitución."

 arg_batalla_cepeda_1859.a: "Firmar el Pacto de San José de Flores."
 # --- 1860 ---
 arg_presidencia_derqui.t: "Santiago Derqui y la Unión Frágil"
 arg_presidencia_derqui.d: "Urquiza deja la presidencia y asume el cordobés Santiago Derqui. Su misión es casi imposible: mantener unidos a los federales del interior y a los liberales de Buenos Aires. La desconfianza mutua es tan grande que el más mínimo roce podría reabrir la guerra civil."
 arg_presidencia_derqui.a: "Intentar un gobierno de unidad nacional."

 # --- 1861 ---
 arg_batalla_pavon_1861.t: "La Batalla de Pavón"
 arg_batalla_pavon_1861.d: "En las orillas del arroyo Pavón, los ejércitos de la Confederación y Buenos Aires han chocado. Pero algo inaudito ha sucedido: tras un combate indeciso, el General Urquiza ha retirado a su caballería entrerriana hacia el Paraná. Este #v $arg_loc_enigma_pavon$#! ha dejado la victoria en manos de Bartolomé Mitre. La Confederación se desmorona y el camino a la unificación porteña está libre."
 arg_batalla_pavon_1861.f: "«Urquiza se fue, no porque le ganaran, sino porque no quiso ganar». — Comentario de la época."

 # --- 1862 ---
 arg_objetivo_poblacion_desc: "Alcanzar una población total de al menos 3 millones de habitantes."
 arg_objetivo_alfabetizacion_desc: "Elevar la tasa de alfabetización nacional al 25%."
 arg_objetivo_ferrocarril_desc: "Establecer la primera red ferroviaria que conecte las provincias."
 
 arg_mision_gobernar_es_poblar_status: "La nación está recibiendo el flujo de la civilización. Los campos se llenan de colonos y las ciudades de escuelas."
 arg_presidencia_mitre.t: "La República Unificada"
 arg_presidencia_mitre.d: "Tras la victoria en Pavón y la renuncia de las autoridades de la Confederación, #v $arg_loc_mitre$#! ha sido elegido presidente. Por primera vez en décadas, Buenos Aires y las Provincias caminan bajo una misma bandera y una misma Constitución. El desafío ahora es pacificar el interior y modernizar la nación."
 arg_presidencia_mitre.f: "«Todo está por hacerse: no tenemos tesoro, no tenemos ejército, no tenemos ni siquiera un edificio donde reunir al gabinete». — Reflexión de Bartolomé Mitre al asumir."
 arg_presidencia_mitre.a: "Unidad y Libertad."

 # --- 1863 ---
 arg_rebelion_chacho.t: "La Lanza del Chacho Peñaloza"
 arg_rebelion_chacho.d: "En los llanos de La Rioja, el caudillo Ángel Vicente 'El Chacho' Peñaloza se ha alzado en armas. Representa el último grito de las provincias contra el centralismo de #v $arg_loc_mitre$#!. La pacificación del interior exige sangre, pero el progreso no se detendrá."
 arg_rebelion_chacho.a: "No hay paz sin orden. ¡Aplastad la rebelión!"

 # --- 1865 ---
 arg_guerra_paraguay_inicio.t: "¡En veinticuatro horas en los cuarteles!"
 arg_guerra_paraguay_inicio.d: "El Mariscal #v $arg_loc_solano_lopez$#! ha invadido la provincia de Corrientes tras la negativa de nuestro gobierno de permitirle el paso hacia Uruguay. La indignación en Buenos Aires es total. #v $arg_loc_mitre$#! ha prometido una campaña relámpago, pero la realidad del terreno y la determinación paraguaya sugieren un conflicto mucho más largo y costoso."
 arg_g_paraguay.f: "«En 24 horas en los cuarteles, en quince días en campaña, en tres meses en Asunción». — Atribuido a Bartolomé Mitre."
 arg_guerra_paraguay_inicio.a: "Firmar el Tratado de la #v $arg_loc_triple_alianza$#!."
 arg_guerra_paraguay_inicio.b: "Evitar el conflicto y buscar la paz."

 # --- 1866 ---
 arg_desastre_curupayty.t: "El Desastre de $arg_loc_curupayty$"
 arg_desastre_curupayty.d: "Las noticias del frente son devastadoras. El asalto a las trincheras de Curupayty ha terminado en una masacre para nuestras tropas. La confianza en el mando de #v $arg_loc_mitre$#! se desmorona y en las provincias del interior comienzan a oírse gritos contra una guerra que consideran ajena."
 arg_desastre_curupayty.a: "Debemos persistir hasta la victoria final."

 # --- 1867 ---
 arg_inicio_futbol.t: "Un Extraño Juego de Pelota"
 arg_inicio_futbol.d: "En los prados de Palermo, un grupo de residentes británicos ha organizado el #v $arg_loc_primer_partido_futbol$#!. Los locales observan con curiosidad cómo veinte hombres corren tras una pelota de cuero intentando meterla en un arco. Nadie imagina que este 'pasatiempo de ingleses' terminará convirtiéndose en la pasión más grande de nuestra nación."
 arg_inicio_futbol.a: "Una curiosa distracción para los inmigrantes."

 # --- 1868 ---
 arg_presidencia_sarmiento.t: "El Maestro de América"
 arg_presidencia_sarmiento.d: "Mientras se encuentra en Estados Unidos, #v $arg_loc_sarmiento$#! ha sido elegido presidente. Su obsesión es clara: la escuela es la base de la República. Bajo su mando, se fundarán cientos de colegios y se traerán maestras norteamericanas para revolucionar la enseñanza."
 arg_presidencia_sarmiento.a: "¡Escuelas, muchas escuelas!"

 # --- 1869 ---
 arg_censo_nacional_1869.t: "Conocernos para Gobernar"
 arg_censo_nacional_1869.d: "Bajo las órdenes de #v $arg_loc_sarmiento$#!, se ha llevado a cabo el #v $arg_loc_censo_1869$#!. Los resultados son un baño de realidad: somos una nación vasta pero casi vacía, y la mayoría de nuestros ciudadanos no saben leer ni escribir. Estos datos serán la brújula para nuestras futuras reformas de inmigración y educación."
 arg_censo_nacional_1869.a: "Los números no mienten."
 arg_exposicion_cordoba.t: "El Progreso en el Corazón de la República"
 arg_exposicion_cordoba.d: "Se ha inaugurado en Córdoba una gran exposición de artes y productos nacionales. Es un mensaje político: la modernidad no debe detenerse en el puerto de Buenos Aires. Maquinaria agrícola, tejidos y nuevas tecnologías se exhiben para demostrar que la Confederación unificada camina hacia la industria."
 arg_exposicion_cordoba.a: "Hacia una nación industrializada."

 # --- 1870 ---
 arg_opcion_varela_nombre: "Proclamar que la victoria no da derechos sobre los vencidos."
 arg_opcion_anexion_nombre: "Exigir el pago de reparaciones y anexar territorios en disputa."
 
 arg_fin_guerra_paraguay.t: "El Final de la Gran Guerra"
 arg_fin_guerra_paraguay.d: "Las noticias llegan desde el norte: el #v $arg_loc_solano_lopez$#! ha caído en el #v $arg_loc_cerro_cora$#!. La guerra más sangrienta de nuestra historia ha terminado. Paraguay yace en ruinas, y ahora nos enfrentamos al dilema de la paz. ¿Debemos exigir reparaciones y territorios, o mostrar la grandeza de una nación civilizada?"
 arg_fin_guerra_paraguay.f: "«La República Argentina, que acaba de salir triunfante de una guerra penosa, no ha querido nunca abusar de su victoria». — Nota de la Cancillería Argentina."

 arg_asesinato_urquiza.t: "Sangre en el Palacio San José"
 arg_asesinato_urquiza.d: "El General #v $arg_loc_urquiza$#! ha sido asesinado en su propia residencia por seguidores de Ricardo López Jordán. Los federales más radicales nunca le perdonaron su retiro en Pavón ni su acercamiento a Sarmiento. Con su muerte, termina la era de los caudillos históricos y Entre Ríos entra en un caos que debemos sofocar."
 arg_asesinato_urquiza.a: "Se apaga la última gran lanza del Federalismo."

 # --- 1871 ---
 arg_fiebre_amarilla_1871.t: "La Peste en el Puerto"
 arg_fiebre_amarilla_1871.d: "El verano ha traído un horror inesperado a Buenos Aires. La #v $arg_loc_fiebre_amarilla$#! se extiende por los barrios del sur, alimentada por el calor y el hacinamiento. El gobierno de #v $arg_loc_sarmiento$#! y las autoridades locales han huido de la ciudad, dejando a comisiones populares el manejo de la crisis. Las calles están desiertas, los comercios cerrados y los muertos se cuentan por cientos cada día."
 arg_fiebre_amarilla_1871.f: "«El padre abandona al hijo, la esposa al esposo. El terror ha roto todos los vínculos humanos». — Relato de un sobreviviente."
 arg_fiebre_amarilla_1871.a: "Debemos modernizar el sistema de aguas y cloacas."
 arg_fiebre_amarilla_1871.b: "La élite abandona el casco histórico."

 # --- 1879 ---
 arg_campaña_roca_1879.t: "La Conquista del Desierto"
 arg_campaña_roca_1879.d: "El General #v $arg_loc_julio_roca$#! ha lanzado su ofensiva definitiva. Equipado con fusiles Remington y apoyado por el telégrafo, el ejército nacional se desplaza como una máquina moderna sobre la pampa. El objetivo es claro: llevar la civilización hasta los confines del sur y asegurar que el pabellón nacional ondee en las puertas de la Patagonia, antes de que otras potencias reclamen esos territorios."
 arg_campaña_roca_1879.f: "«Sellaréis con vuestras espadas la ley más importante de la República: la ley que entrega el desierto a la labor del hombre blanco». — Julio A. Roca a sus tropas."
 
 # --- 1872-1878 ---
 arg_telegrafo_sarmiento.t: "Hilos que Unen la República"
 arg_telegrafo_sarmiento.d: "Bajo el incansable impulso de #v $arg_loc_sarmiento$#!, las líneas del telégrafo están cruzando las pampas y los Andes. Pronto, una noticia en Buenos Aires será conocida en San Juan o en Londres en cuestión de minutos. El telégrafo no es solo comercio; es la herramienta definitiva para que el gobierno central controle cada rincón del territorio."
 arg_telegrafo_sarmiento.a: "El pensamiento viaja a la velocidad del rayo."
 arg_atentado_sarmiento.t: "Disparos en la Noche"
 arg_atentado_sarmiento.d: "Dos sicarios han intentado asesinar al Presidente mientras se dirigía a la casa de Dalmacio Vélez Sarsfield. El trabuco de uno de ellos estalló en su mano, y el carruaje de #v $arg_loc_sarmiento$#! siguió su marcha sin que el mandatario, debido a su avanzada sordera, notara el estruendo. La política argentina sigue siendo un terreno peligroso."
 arg_atentado_sarmiento.a: "Las ideas no se matan."
 arg_revolucion_1874.t: "Mitre toma las Armas"
 arg_revolucion_1874.d: "El general #v $arg_loc_mitre$#!, descontento con el triunfo de Nicolás Avellaneda en las urnas, ha iniciado una rebelión militar. El país se encuentra en una encrucijada: ¿Prevalecerá la legitimidad de las instituciones o el prestigio del antiguo héroe de Pavón? El ejército nacional, ahora profesionalizado, debe sofocar este último intento de sedición liberal."
 arg_revolucion_1874.a: "La ley está por encima de los hombres."
 arg_presidencia_avellaneda.t: "La Presidencia de la Austeridad"
 arg_presidencia_avellaneda.d: "Nicolás Avellaneda ha asumido el mando en un momento crítico. Con las arcas vacías y la deuda externa asfixiando la nación, el nuevo presidente ha sido tajante: 'La República puede estar dividida en partidos, pero no tiene sino un honor y un crédito'. Se avecinan tiempos de sacrificios económicos para salvar el buen nombre de la Argentina en los mercados de Londres."
 arg_presidencia_avellaneda.a: "Ahorrar sobre el hambre y la sed de los argentinos."
 arg_ley_inmigracion_1876.t: "La Tierra de Promisión"
 arg_ley_inmigracion_1876.d: "El Congreso ha sancionado la #v $arg_loc_ley_avellaneda$#!. A partir de ahora, cada inmigrante que llegue a nuestras costas será protegido y ayudado por el Estado. Se les garantiza alojamiento gratuito en el Hotel de Inmigrantes y transporte hacia las colonias del interior. ¡El sueño de Alberdi y Sarmiento se hace ley!"
 arg_ley_inmigracion_1876.a: "Abrir las puertas de la Nación."
 arg_cultura_mate.t: "El Rito del Mate"
 arg_cultura_mate.d: "En los fogones de la frontera y en los patios de los conventillos, el #v $arg_loc_yerba_mate$#! sigue siendo el nexo que une a los argentinos. A pesar de los intentos de las clases altas por imitar las costumbres europeas, el amargo sabor de la yerba persiste como un símbolo de resistencia cultural y fraternidad criolla."
 arg_cultura_mate.a: "El mate nunca faltará en esta tierra."
 arg_evento_hesperidina.t: "Hesperidina: El Orgullo Nacional"
 arg_evento_hesperidina.d: "El éxito de la #v $arg_loc_hesperidina$#! ha sido tal que su creador ha solicitado la protección del Estado contra las imitaciones. El presidente ha firmado la Patente N°1 de la República. Esta bebida de naranjas no solo refresca los almacenes, sino que simboliza el nacimiento de una industria nacional con identidad propia."
 arg_evento_hesperidina.a: "Proteger la invención nacional."
 arg_buque_frigorifico.t: "El Triunfo del Frío"
 arg_buque_frigorifico.d: "El buque #v $arg_loc_frigorifico$#! ha llegado a nuestras costas demostrando que la tecnología de refrigeración permite llevar carne fresca a través del Atlántico. Esto cambia las reglas del juego: ya no exportaremos solo saladero; ahora el mundo comerá nuestra mejor carne vacuna."
 arg_buque_frigorifico.a: "Invertir en la mejora de las razas bovinas."
 arg_conciliacion_1877.t: "La Unión de los Argentinos"
 arg_conciliacion_1877.d: "El presidente #v $arg_loc_nicolas_avellaneda$#! ha extendido una rama de olivo a sus antiguos enemigos. Mediante la #v $arg_loc_conciliacion_politica$#!, los líderes de las facciones en pugna han acordado dejar de lado las armas para trabajar en la organización nacional. Aunque los más radicales critican este pacto, la paz interna parece, por fin, una posibilidad real."
 arg_conciliacion_1877.a: "La paz es el primer requisito del progreso."
 arg_zanja_alsina.t: "Una Muralla en la Pampa"
 arg_zanja_alsina.d: "El ministro Adolfo Alsina ha avanzado con su plan de defensa: la #v $arg_loc_zanjadealsina$#!. Miles de hombres cavan una fosa gigante para proteger las tierras ganaderas de los ataques. Sin embargo, tras la reciente muerte de Alsina, un joven general llamado #v $arg_loc_roca$#! critica este plan, asegurando que 'la zanja es una actitud defensiva' y que el país debe pasar al ataque definitivo."
 arg_zanja_alsina.a: "Terminar la zanja para proteger el ganado."
 arg_zanja_alsina.b: "Escuchar al General Roca: la defensa no es suficiente."

 # --- 1879 ---
 arg_aguas_corrientes_1879.t: "Higiene y Civilización"
 arg_aguas_corrientes_1879.d: "Tras los horrores de la fiebre amarilla, el gobierno ha aprobado los planes para la red de aguas corrientes más ambiciosa de Sudamérica. La salud de la Capital ya no dependerá de los aguateros del río. Este proyecto no solo salvará vidas, sino que demostrará que Argentina es una nación moderna y saludable."
 arg_aguas_corrientes_1879.a: "Agua limpia para un pueblo sano."
 arg_campaña_roca_1879.a: "Incorporar las tierras del sur al mercado nacional."
 arg_remington_telegrafo.t: "Remington y Telégrafo"
 arg_remington_telegrafo.d: "La campaña no solo se libra con caballos y sables. La llegada de los fusiles de repetición #v Remington#! y el tendido de líneas telegráficas que conectan los fortines con Buenos Aires han cambiado las reglas de la guerra. La coordinación en tiempo real y el poder de fuego han vuelto obsoletas las antiguas lanzas del desierto."
 arg_remington_telegrafo.a: "La tecnología es el brazo armado de la civilización."

 # --- 1880 ---
 arg_evento_alambrado.f: "«El alambre de hierro ha sido para la propiedad rural lo que el telégrafo para el pensamiento: una revolución silenciosa que lo cambió todo»."
 arg_ramos_generales_1880.f: "«En el mostrador del almacén, todos los hombres son iguales ante la ginebra y el destino»."
 arg_revolucion_tejedor.t: "La Última Batalla por la Capital"
 arg_revolucion_tejedor.d: "La tensión ha llegado a su punto de quiebre. El gobernador #v $arg_loc_carlos_tejedor$#! ha movilizado a las milicias provinciales, negándose a que Buenos Aires entregue su autonomía y sus rentas. El presidente Avellaneda ha tenido que trasladar el gobierno al pueblo de Belgrano mientras el ejército nacional de #v $arg_loc_roca$#! se prepara para sitiar la ciudad. Es el enfrentamiento final entre el orden nacional y el orgullo porteño."
 arg_revolucion_tejedor.a: "Someter a Buenos Aires por la fuerza de la ley."
 arg_ley_capital_federal.t: "Buenos Aires: Capital de la República"
 arg_ley_capital_federal.d: "Se ha sancionado finalmente la #v $arg_loc_federalizacion_ba$#!. Buenos Aires ya no pertenece a los porteños, sino a toda la Nación. Con este acto, se nacionaliza la aduana y se pone fin a siete décadas de guerras civiles. Una nueva era de paz y administración centralizada comienza bajo el lema de 'Paz y Administración'."
 arg_ley_capital_federal.a: "La cuestión de la Capital ha terminado."
 arg_evento_alambrado.t: "El Fin de la Pampa Abierta"
 arg_evento_alambrado.d: "Lo que comenzó como una curiosidad en la estancia de #v $arg_loc_richard_newton$#! se ha convertido en una necesidad nacional. El #v $arg_loc_alambrado$#! está cubriendo la llanura, trazando líneas infranqueables de acero. Los estancieros celebran el control total sobre sus rodeos, pero para el gaucho y sus tradiciones de libertad, el alambre es una frontera que anuncia el fin de una era."
 arg_evento_alambrado.a: "Delimitar la propiedad es civilizar la tierra."
 arg_ramos_generales_1880.t: "El Almacén de Ramos Generales"
 arg_ramos_generales_1880.d: "En cada cruce de caminos y en cada pueblo nuevo que nace junto al ferrocarril, surge un #v $arg_loc_almacen_ramos_generales$#!. Entre bolsas de arpillera con olor a yerba y estanterías llenas de conservas europeas, se forja la identidad del país. Es el lugar donde el pulpero fía al paisano y donde se discute la política de la Capital mientras se comparte un salame y un queso de colonia."
 arg_ramos_generales_1880.a: "Brindar por el progreso de la campaña."
 arg_presidencia_roca_1880.t: "El Zorro en la Rosada"
 arg_presidencia_roca_1880.d: "Tras sus éxitos militares en el sur y la derrota de la rebelión porteña, #v $arg_loc_julio_roca$#! ha asumido la presidencia. Su visión es pragmática: el Estado debe ser fuerte para que el mercado sea libre. Se inicia una era de orden riguroso donde las viejas pasiones federales y unitarias son reemplazadas por la administración técnica y el progreso material."
 arg_presidencia_roca_1880.a: "Paz y Administración para la República."

 # --- 1882-1883 ---
 arg_fundacion_la_plata.t: "La Plata: La Ciudad Planificada"
 arg_fundacion_la_plata.d: "Dardo Rocha ha fundado la nueva capital de la provincia de Buenos Aires: #v La Plata#!. Diseñada con diagonales perfectas, plazas cada seis cuadras e iluminación eléctrica (la primera en Sudamérica), esta ciudad es el símbolo máximo del racionalismo y el optimismo de la Generación del 80."
 arg_fundacion_la_plata.a: "Un faro de modernidad en la pampa."
 arg_perito_moreno_1883.t: "El Centinela de los Andes"
 arg_perito_moreno_1883.d: "El joven científico #v $arg_loc_perito_moreno$#! ha regresado de sus expediciones por los lagos del sur. Sus mapas y estudios demuestran que el #v $arg_loc_nahuel_huapi$#! y las montañas circundantes son la clave para nuestra frontera definitiva. Moreno no solo trae datos geográficos; trae la visión de una Patagonia integrada a la Nación a través de la ciencia y la soberanía."
 arg_perito_moreno_1883.a: "La ciencia es nuestra mejor defensa."
 arg_gath_chaves_1883.t: "La Elegancia de la Gran Aldea"
 arg_gath_chaves_1883.d: "Lorenzo Chaves y Alfredo Gath han fundado una pequeña tienda en Buenos Aires que promete traer lo último de la moda de Londres y París. Lo que hoy es un local modesto, pronto se convertirá en el epicentro del lujo sudamericano, demostrando que Buenos Aires ya no es un puerto de barro, sino una metrópolis cosmopolita."
 arg_gath_chaves_1883.a: "Buenos Aires se viste de gala."
 
 # --- 1884 ---
 arg_fundacion_ushuaia.t: "La Fundación de $arg_loc_ushuaia$"
 arg_fundacion_ushuaia.d: "Lo que comenzó como una misión anglicana se ha convertido hoy en el puesto de avanzada más austral de nuestra nación. Ante las pretensiones extranjeras en los mares del sur, el gobierno ha decidido establecer una subprefectura permanente. Algunos sugieren que la mejor forma de poblar este sitio es mediante la creación de un #v $arg_loc_presidio_ushuaia$#!, asegurando que el estado tenga ojos y oídos en el Fin del Mundo."
 arg_fundacion_ushuaia.f: "«Ushuaia no es solo un pueblo, es una centinela». — Augusto Lasserre."
 arg_fundacion_ushuaia.a: "Asegurar la soberanía con un destacamento penal."
 arg_fundacion_ushuaia.b: "Atraer colonos y misioneros."
 arg_ley_1420_evento.t: "La Escuela del Progreso"
 arg_ley_1420_evento.d: "El 8 de julio de 1884, el Congreso sanciona la Ley de Educación Común 1420, impulsada por el ministro Eduardo Wilde. En las aulas de todo el país, niños criollos e hijos de inmigrantes italianos, españoles y franceses se sentarán juntos por primera vez. La educación será gratuita, obligatoria y laica. \n\nEn las escuelas normales, maestras como las hermanas Cossettini ya preparan una revolución pedagógica. Los libros de lectura llevarán las palabras de Sarmiento a cada rincón de la pampa. La Iglesia protesta por la exclusión de la doctrina religiosa del horario escolar, pero el espíritu de la época es imparable: Argentina forjará ciudadanos ilustrados."
 arg_ley_1420_evento.f: "«Leer, escribir y contar, y conocer la Constitución: eso es lo que necesita un ciudadano». — Eduardo Wilde, Ministro de Instrucción Pública."
 arg_ley_1420_evento.a: "¡Que florezcan las escuelas en cada pueblo!"
 arg_ley_1420_evento.b: "Avanzar con prudencia, respetando las tradiciones."
 arg_ruptura_vaticano.t: "Expulsión del Nuncio"
 arg_ruptura_vaticano.d: "La tensión por el #v $arg_loc_registro_civil$#! y la educación ha llegado al límite. El gobierno nacional ha entregado sus pasaportes al Nuncio Apostólico, monseñor Mattera, ordenándole abandonar el país. Argentina afirma su soberanía sobre las conciencias de sus habitantes, desafiando la autoridad de Roma."
 arg_ruptura_vaticano.a: "No hay más autoridad que la del Estado Argentino."
 arg_matrimonio_civil.t: "El Matrimonio ante la Ley"
 arg_matrimonio_civil.d: "El 2 de noviembre de 1884, el Congreso debate una ley que sacudirá los cimientos de la sociedad argentina: el matrimonio civil obligatorio. Hasta ahora, solo la Iglesia Católica podía unir a las parejas ante Dios y la ley. Pero el Estado liberal de la Generación del '80 reclama su autoridad sobre los actos civiles de los ciudadanos.\n\nEn los salones porteños, las familias tradicionales se escandalizan. ¿Cómo puede el Estado arrogarse una potestad que siempre fue de la Iglesia? Pero los liberales argumentan que en una nación de inmigrantes —italianos, españoles, franceses, judíos, protestantes— el matrimonio debe ser un acto civil, accesible a todos sin distinción de credo. La ley permitirá que católicos, protestantes y librepensadores se casen ante un juez, separando definitivamente la esfera religiosa de la civil."
 arg_matrimonio_civil.f: "«El matrimonio es un contrato civil. La religión es un asunto de conciencia». — Debate parlamentario, 1884."
 arg_matrimonio_civil.a: "El Estado es soberano sobre los actos civiles."
 arg_matrimonio_civil.b: "Permitir que la ceremonia religiosa tenga validez opcional."

 # --- 1885 ---
 arg_faro_1885.t: "La Luz en el Confín"
 arg_faro_1885.d: "En la desolada Isla de los Estados, la luz del #v $arg_loc_faro_fin_del_mundo$#! ya brilla con regularidad. Para el gobierno de #v $arg_loc_julio_roca$#!, este faro no es solo una ayuda a la navegación; es una declaración de soberanía. Donde hay luz argentina, hay territorio nacional. Los marinos de todo el mundo ahora reconocen que estas aguas australes tienen un dueño."
 arg_faro_1885.f: "«Esa luz es la voz del Estado que dice: 'Aquí comienza la Argentina'». — Comentario en la prensa de la época."
 arg_faro_1885.a: "Iluminar el paso de las naciones."
 arg_tranvias_1885.t: "Los Rieles de la Capital"
 arg_tranvias_1885.d: "El sistema de #v $arg_loc_tranvias$#! se extiende como una tela de araña por Buenos Aires. Los viejos carros a caballo están siendo superados por una red eficiente que permite a los trabajadores y a la burguesía vivir lejos del centro. La ciudad crece, se estira y late al ritmo del metal sobre el empedrado."
 arg_tranvias_1885.a: "Modernizar la locomoción urbana."

 # --- 1886 ---
 arg_presidencia_juarez_celman.t: "El Yerno del Zorro"
 arg_presidencia_juarez_celman.d: "El 12 de octubre de 1886, Miguel Juárez Celman asume la presidencia de la República. Yerno del general Julio A. Roca, el nuevo mandatario promete continuar la obra de modernización iniciada por su predecesor. En su discurso inaugural, habla con entusiasmo de ferrocarriles, puertos, telégrafos y escuelas. Los salones porteños comentan que el país está en buenas manos, y que la prosperidad continuará. El optimismo reina en Buenos Aires, donde las obras públicas se multiplican y el crédito extranjero fluye generosamente."
 arg_presidencia_juarez_celman.f: "«Gobernar es poblar, pero también es construir.» - Lema de la época"
 arg_presidencia_juarez_celman.a: "Que florezcan las obras públicas."
 arg_presidencia_juarez_celman.b: "Mejor ser prudentes con el gasto."

 # --- 1887 ---
 arg_bancos_garantidos_1887.t: "La Quimera del Oro"
 arg_bancos_garantidos_1887.d: "La Ley de Bancos Garantidos ha desatado una fiebre especulativa sin precedentes. Se fundan bancos por doquier solo para emitir billetes respaldados por bonos públicos, inundando la plaza de papel moneda. La Bolsa de Comercio es un hervidero donde se hacen fortunas de la noche a la mañana, mientras la inflación comienza a carcomer los salarios reales."
 arg_bancos_garantidos_1887.a: "¡Que el crédito no se detenga!"

 # --- 1889 ---
 arg_puerto_madero_1889.t: "Un Puerto para el Mundo"
 arg_puerto_madero_1889.d: "Tras años de debates entre los proyectos de Huergo y Madero, se ha inaugurado la primera sección del puerto diseñado por Eduardo Madero. Con sus diques de ladrillo y grúas hidráulicas, promete acabar con la vergüenza del desembarco en carretas. Sin embargo, las voces críticas advierten que su diseño de esclusas es costoso y complicado para el tráfico moderno."
 arg_puerto_madero_1889.a: "Buenos Aires debe tener un puerto monumental."

 arg_crisis_economica_1889.t: "El Estallido de la Burbuja"
 arg_crisis_economica_1889.d: "La fiebre especulativa ha llegado a su fin. El Banco Constructor de La Plata ha quebrado, arrastrando consigo a decenas de instituciones financieras. La inflación devora los salarios, el desempleo crece, y las calles de Buenos Aires hierven de descontento. Los billetes que ayer valían oro hoy apenas sirven para encender el fuego. La confianza en el gobierno de Juárez Celman se desmorona junto con la economía nacional."
 arg_crisis_economica_1889.f: "«El país está al borde del abismo financiero.» - La Prensa, julio de 1889"
 arg_crisis_economica_1889.a: "Debemos sostener el sistema a cualquier costo."
 arg_crisis_economica_1889.b: "Que el mercado encuentre su propio equilibrio."

 # --- 1890 ---
 arg_revolucion_parque_1890.t: "La Revolución del Parque"
 arg_revolucion_parque_1890.d: "En la madrugada del 26 de julio, el estruendo de los cañones despierta a Buenos Aires. La Unión Cívica, liderada por Leandro N. Alem y con el apoyo de sectores militares descontentos, ha tomado el Parque de Artillería. Durante tres días, la ciudad es un campo de batalla. Aunque las fuerzas leales al gobierno logran sofocar el levantamiento, la victoria es pírrica: Juárez Celman ha perdido toda legitimidad. El país entero exige su renuncia."
 arg_revolucion_parque_1890.f: "«La revolución está vencida, pero el gobierno está muerto.» - Aristóbulo del Valle"
 arg_revolucion_parque_1890.a: "Juárez debe renunciar. Que venga Pellegrini."
 arg_revolucion_parque_1890.b: "El orden debe imponerse por la fuerza."

 # --- Homenajes y Cultura ---
 arg_homenaje_belgrano.t: "El Manto de la Patria"
 arg_homenaje_belgrano.d: "En medio de las tensiones con las potencias extranjeras, el gobernador Rosas ha ordenado celebrar con especial fervor el legado de #v $arg_loc_belgrano$#!. La bandera celeste y blanca que él creó en las barrancas del Paraná es hoy el símbolo de nuestra resistencia. Su ejemplo de austeridad y servicio es invocado para unir a los federales ante la amenaza externa."
 arg_homenaje_belgrano.a: "Su bandera nos cobija a todos."

 # --- 1891-1892 ---
 arg_banco_nacion_1891.t: "El Banco de la Nación Argentina"
 arg_banco_nacion_1891.d: "La crisis de 1890 ha destruido el sistema bancario anterior. El presidente #v $arg_loc_carlos_pellegrini$#! ha propuesto una medida audaz: la creación de un banco estatal sólido que no sea una herramienta de especulación, sino un motor de desarrollo. El Banco Nación nace para dar crédito a los que producen y para demostrar al mundo que Argentina ha vuelto a ponerse de pie."
 arg_banco_nacion_1891.a: "Una institución para la reconstrucción."

 # --- 1891 ---
 arg_fundacion_ucr_1891.t: "Nace la Unión Cívica Radical"
 arg_fundacion_ucr_1891.d: "En el Jardín Florida de Buenos Aires, #v Leandro N. Alem#! ha proclamado la fundación de la Unión Cívica Radical. Tras el fracaso parcial de la Revolución del Parque, los sectores más intransigentes de la oposición se niegan a pactar con el régimen. Su bandera es clara: sufragio libre, honesto y universal. No aceptarán cargos ni negociarán hasta que la voluntad popular sea respetada. El viejo orden oligárquico tiene ahora un enemigo que no puede ser comprado."
 arg_fundacion_ucr_1891.f: "«¡Adelante los que quedan! Que se vayan los que se cansan.» — Leandro N. Alem"
 arg_fundacion_ucr_1891.a: "Un nuevo actor político ha nacido."
 arg_fundacion_ucr_1891.b: "Ignorar a estos agitadores."

 # --- 1892 ---
 arg_nacimiento_ucr_1892.t: "¡Adelante, Radicales!"
 arg_nacimiento_ucr_1892.d: "La paz de Pellegrini no ha conformado a todos. Tras la división de la Unión Cívica, #v Leandro N. Alem#! ha fundado la Unión Cívica Radical. Su proclama es la 'intransigencia': no aceptarán cargos del gobierno hasta que el sufragio sea libre y honesto. El régimen del PAN tiene ahora un enemigo que no puede ser comprado con cargos ni dinero."
 arg_nacimiento_ucr_1892.a: "La lucha por la pureza del sufragio ha comenzado."

 # --- Evento de Misión ---
 arg_fin_mision_poblar.1.t: "Una Nación en Marcha"
 arg_fin_mision_poblar.1.d: "Hemos cumplido los objetivos de la Organización Nacional. La población crece, la educación se expande y los ferrocarriles conectan nuestras vastas tierras. Argentina ya no es una promesa, sino una realidad pujante que atrae capitales y personas de todo el mundo. El futuro es nuestro."
 arg_fin_mision_poblar.1.f: "«América es la tierra de promisión para todos los hombres de buena voluntad que quieran habitar el suelo argentino». — Preámbulo de la Constitución Nacional."
 arg_fin_mision_poblar.1.a: "Fomentar la industria nacional."
 arg_fin_mision_poblar.1.b: "Consolidar nuestro prestigio internacional."
 # --- Nuevos Eventos 1893-1910 ---

 # --- 1893 ---
 arg_revolucion_radical_1893.t: "La Revolución Radical de 1893"
 arg_revolucion_radical_1893.d: "La Unión Cívica Radical ha tomado las armas en Santa Fe, Buenos Aires y Tucumán. #v Leandro N. Alem#! y sus seguidores denuncian el fraude electoral y exigen el sufragio libre. Las milicias provinciales se han sumado a la rebelión, pero el ejército nacional permanece leal al gobierno. Es la primera gran prueba de fuego para la democracia argentina."
 arg_revolucion_radical_1893.f: "«¡Sufragio libre o revolución!» — Consigna radical."
 arg_revolucion_radical_1893.a: "Aplastar la sedición con mano de hierro."
 arg_revolucion_radical_1893.b: "Buscar una salida negociada y reformas."

 # --- 1894 ---
 arg_primer_automovil_1894.t: "El Primer Automóvil en Buenos Aires"
 arg_primer_automovil_1894.d: "Una extraña máquina sin caballos ha aparecido en las calles de Buenos Aires. El #v $arg_loc_primer_automovil$#! importado por un comerciante local causa sensación entre los paseantes de la Avenida de Mayo. Los niños corren tras él gritando, mientras los cocheros observan con preocupación este invento que podría cambiar para siempre el transporte urbano."
 arg_primer_automovil_1894.a: "Una curiosidad que pronto será común."

 # --- 1895 ---
 arg_censo_nacional_1895.t: "El Segundo Censo Nacional"
 arg_censo_nacional_1895.d: "Los resultados del censo son asombrosos: Argentina cuenta ahora con #v 4.044.911 habitantes#!, más del doble que en 1869. En provincias como Santa Fe, el #v 42% de la población es extranjera#!. Italianos, españoles, franceses y alemanes han transformado el rostro de la nación. Las colonias agrícolas prosperan, las ciudades crecen vertiginosamente. Somos testigos de una transformación sin precedentes en la historia sudamericana."
 arg_censo_nacional_1895.f: "«Gobernar es poblar, y poblar es civilizar». — Los números confirman el éxito de la política migratoria."
 arg_censo_nacional_1895.a: "¡Argentina es una nación moderna!"
 arg_censo_nacional_1895.b: "Tantos extranjeros amenazan nuestra identidad."

 # --- 1905 ---
 arg_fundacion_boca_1905.t: "Nace el Club Atlético Boca Juniors"
 arg_fundacion_boca_1905.d: "En el barrio de La Boca, un grupo de jóvenes inmigrantes italianos ha fundado un club de fútbol. Inspirados por los colores de la bandera sueca de un barco en el puerto, han elegido el azul y amarillo como sus colores. Lo que comenzó como un pasatiempo de domingo pronto se convertirá en una pasión que unirá a todo el barrio."
 arg_fundacion_boca_1905.a: "El fútbol une a los hijos de inmigrantes."

 # --- 1896 ---
 arg_primera_pelicula_1896.t: "La Bandera Argentina: Primera Película Nacional"
 arg_primera_pelicula_1896.d: "El francés Eugène Py ha filmado las primeras imágenes en movimiento en territorio argentino. Su cortometraje #v 'La Bandera Argentina'#! muestra el pabellón nacional flameando en la Plaza de Mayo. Es el nacimiento del cine nacional, una nueva forma de arte que promete revolucionar el entretenimiento popular."
 arg_primera_pelicula_1896.a: "El arte del futuro ha llegado a Argentina."

 # --- 1907 ---
 arg_huelga_inquilinos_1907.t: "La Huelga de Inquilinos"
 arg_huelga_inquilinos_1907.d: "Los conventillos del sur de Buenos Aires están en ebullición. Miles de familias inmigrantes se niegan a pagar los alquileres abusivos, denunciando el hacinamiento y las condiciones insalubres. La #v $arg_loc_huelga_inquilinos$#! ha paralizado barrios enteros. Las mujeres lideran la protesta, colgando escobas en las ventanas como símbolo de resistencia."
 arg_huelga_inquilinos_1907.f: "«¡No más conventillos! ¡Vivienda digna para el pueblo trabajador!» — Consigna de los huelguistas."
 arg_huelga_inquilinos_1907.a: "Desalojar por la fuerza a los morosos."
 arg_huelga_inquilinos_1907.b: "Regular los alquileres y mejorar las condiciones."

 # --- 1898 ---
 arg_roca_segundo_gobierno_1898.t: "El Retorno del Zorro"
 arg_roca_segundo_gobierno_1898.d: "Julio Argentino Roca vuelve a la Casa Rosada después de 12 años. El 'Zorro' que conquistó el desierto y modernizó la nación regresa con la promesa de estabilidad y progreso. Su experiencia y astucia política son innegables, pero también lo es su compromiso con el régimen oligárquico. Los radicales denuncian que su elección fue producto del fraude, mientras los conservadores celebran el retorno de la mano firme."
 arg_roca_segundo_gobierno_1898.f: "«Paz y administración». — Lema del segundo gobierno de Roca."
 arg_roca_segundo_gobierno_1898.a: "Roca traerá orden y progreso."
 arg_roca_segundo_gobierno_1898.b: "Este retorno perpetúa la oligarquía."

 arg_servicio_militar_1898.t: "El Servicio Militar Obligatorio"
 arg_servicio_militar_1898.d: "El Congreso ha sancionado la ley que establece el #v $arg_loc_servicio_militar_obligatorio$#! para todos los varones argentinos. El general Pablo Riccheri, inspirado en el modelo prusiano, busca crear un ejército moderno y profesional. Pero también persigue un objetivo social: que el cuartel sea la 'escuela de la patria' donde se forjen ciudadanos disciplinados."
 arg_servicio_militar_1898.f: "«El cuartel será la escuela complementaria de la escuela primaria». — General Pablo Riccheri."
 arg_servicio_militar_1898.a: "Todos los argentinos deben servir a la patria."
 arg_servicio_militar_1898.b: "Mantener el sistema de voluntarios."

 # --- 1899 ---
 arg_conflicto_chile_1899.t: "Crisis en los Andes"
 arg_conflicto_chile_1899.d: "La tensión con Chile ha alcanzado su punto máximo. Ambas naciones reclaman vastos territorios en la Patagonia y la Puna de Atacama. Los ejércitos se movilizan, los diarios hablan de guerra inminente, y los diplomáticos europeos observan con preocupación. En Buenos Aires y Santiago se escuchan voces belicistas, pero también hay quienes proponen someter la disputa al arbitraje británico. Una guerra entre hermanos sería una tragedia, pero ceder territorio es impensable para muchos."
 arg_conflicto_chile_1899.f: "«Los Andes no deben ser frontera, sino unión entre hermanos». — Voz pacifista de la época."
 arg_conflicto_chile_1899.a: "Preparar al ejército para defender nuestros derechos."
 arg_conflicto_chile_1899.b: "Buscar el arbitraje británico para resolver la disputa."

 arg_conflictos_laborales_1899.t: "Los Primeros Conflictos Obreros"
 arg_conflictos_laborales_1899.d: "La industrialización ha traído nuevos problemas. En los talleres y fábricas de Buenos Aires, los trabajadores se organizan para exigir mejores salarios y condiciones laborales. Los #v $arg_loc_anarquistas$#! y #v $arg_loc_socialistas$#! compiten por liderar estas luchas, mientras los patrones reclaman mano dura del gobierno."
 arg_conflictos_laborales_1899.a: "Reprimir duramente las huelgas."
 arg_conflictos_laborales_1899.b: "Mediar entre patrones y obreros."

 # --- 1900 ---
 arg_modernizacion_1900.t: "Buenos Aires en el Nuevo Siglo"
 arg_modernizacion_1900.d: "El siglo XX encuentra a Buenos Aires transformada. La luz eléctrica ilumina las avenidas, los tranvías eléctricos surcan la ciudad y los primeros rascacielos se alzan hacia el cielo. Los porteños se sienten orgullosos de vivir en la #v 'París de Sudamérica'#!, una metrópolis que rivaliza con las grandes capitales europeas."
 arg_modernizacion_1900.f: "«Buenos Aires es hoy una de las ciudades más hermosas del mundo». — Comentario de un viajero europeo."
 arg_modernizacion_1900.a: "Consolidar nuestro lugar entre las grandes metrópolis."

 # --- 1901 ---
 arg_ley_residencia_1901.t: "La Ley de Residencia"
 arg_ley_residencia_1901.d: "Tras los atentados anarquistas y las huelgas, el Congreso ha sancionado la #v $arg_loc_ley_residencia$#!. Esta norma permite al Poder Ejecutivo expulsar del país a cualquier extranjero que 'comprometa la seguridad nacional o perturbe el orden público'. Los anarquistas la llaman 'ley maldita', pero el gobierno asegura que es necesaria para proteger la paz social."
 arg_ley_residencia_1901.f: "«El derecho de hospitalidad no incluye el derecho a la sedición». — Justificación oficial."
 arg_ley_residencia_1901.a: "Expulsar a los agitadores extranjeros."
 arg_ley_residencia_1901.b: "Respetar los derechos constitucionales."

 # --- 1902 ---
 arg_primera_huelga_general_1902.t: "La Primera Huelga General"
 arg_primera_huelga_general_1902.d: "Por primera vez en la historia argentina, todas las organizaciones obreras han coordinado una #v $arg_loc_huelga_general$#!. Buenos Aires está paralizada: no circulan tranvías, los puertos están cerrados y las fábricas silenciosas. La FORA (Federación Obrera Regional Argentina) demuestra su poder de movilización, desafiando abiertamente al gobierno conservador."
 arg_primera_huelga_general_1902.a: "Declarar el estado de sitio."
 arg_primera_huelga_general_1902.b: "Negociar con los dirigentes sindicales."

 # --- 1903 ---
 arg_tratado_chile_1903.t: "Los Pactos de Mayo con Chile"
 arg_tratado_chile_1903.d: "Tras décadas de tensiones fronterizas, Argentina y Chile han firmado los #v $arg_loc_pactos_de_mayo$#!. El acuerdo establece la limitación naval mutua y el arbitraje del Rey Eduardo VII para resolver las disputas territoriales restantes. Ambas naciones se comprometen a no agredir y a resolver sus diferencias por medios pacíficos."
 arg_tratado_chile_1903.f: "«Que estos pueblos hermanos jamás se vean envueltos en luchas fratricidas». — Declaración conjunta."
 arg_tratado_chile_1903.a: "Sellar la paz definitiva con Chile."

 # --- 1904 ---
 arg_auge_tango_1904.t: "El Tango Conquista los Salones"
 arg_auge_tango_1904.d: "Lo que nació en los arrabales y prostíbulos del Río de la Plata ha comenzado a conquistar los salones elegantes. El #v $arg_loc_tango$#!, esa música melancólica y sensual, ya no es solo cosa de compadritos y milongueras. La alta sociedad porteña empieza a bailarlo, y se dice que pronto llegará a París."
 arg_auge_tango_1904.f: "«El tango es un pensamiento triste que se baila». — Enrique Santos Discépolo."
 arg_auge_tango_1904.a: "Nuestra música conquista el mundo."

 # --- 1905 ---
 arg_revolucion_radical_1905.t: "La Revolución Radical de 1905"
 arg_revolucion_radical_1905.d: "Una vez más, los radicales han tomado las armas. Esta vez la rebelión se extiende por Córdoba, Mendoza y Buenos Aires. #v Hipólito Yrigoyen#! lidera la conspiración desde las sombras, manteniendo su 'intransigencia' ante el régimen conservador. Aunque la revolución fracasa, el prestigio moral de los radicales crece entre las clases medias."
 arg_revolucion_radical_1905.a: "Sofocar una vez más la sedición radical."
 arg_revolucion_radical_1905.b: "Iniciar reformas para calmar los ánimos."

 # --- 1906 ---
 arg_preparativos_centenario_1906.t: "Preparativos para el Centenario"
 arg_preparativos_centenario_1906.d: "Se acerca 1910 y con él la celebración del #v $arg_loc_centenario_mayo$#!. El gobierno ha decidido que Argentina debe mostrar al mundo su progreso y civilización. Se planifican grandes obras: la Avenida de Mayo será ensanchada, se construirán monumentos y se invitará a delegaciones de todo el mundo. Será la gran fiesta de la Argentina moderna."
 arg_preparativos_centenario_1906.a: "Invertir en obras monumentales."
 arg_preparativos_centenario_1906.b: "Una celebración austera y patriótica."

 # --- 1907 ---
 arg_crisis_1907.t: "La Crisis Financiera Mundial"
 arg_crisis_1907.d: "La crisis que comenzó en Wall Street ha llegado a Buenos Aires. Los bancos restringen el crédito, las inversiones británicas se reducen y el desempleo aumenta. La Argentina, tan dependiente del capital extranjero, siente el golpe de la recesión mundial. El gobierno debe decidir cómo enfrentar esta tormenta económica."
 arg_crisis_1907.a: "Política de austeridad y equilibrio fiscal."
 arg_crisis_1907.b: "Invertir en obras públicas para mantener el empleo."

 # --- 1909 ---
 arg_atentado_falcon_1909.t: "El Atentado contra Falcón"
 arg_atentado_falcon_1909.d: "Una bomba anarquista ha segado la vida del jefe de policía #v Ramón L. Falcón#! y su secretario. El atentado, perpetrado por #v Simón Radowitzky#!, ha conmocionado a la sociedad porteña. El gobierno conservador ve en este acto la justificación perfecta para endurecer la legislación contra los 'elementos subversivos'."
 arg_atentado_falcon_1909.f: "«La anarquía ha mostrado su rostro más siniestro». — Editorial de La Nación."
 arg_atentado_falcon_1909.a: "Sancionar la Ley de Defensa Social."
 arg_atentado_falcon_1909.b: "Buscar reformas sociales para calmar las tensiones."

 # --- 1910 ---
 arg_centenario_mayo_1910.t: "El Centenario de la Revolución de Mayo"
 arg_centenario_mayo_1910.d: "¡Ha llegado el gran día! Argentina celebra el #v $arg_loc_centenario_1910$#! con pompa y esplendor. Delegaciones de todo el mundo han llegado a Buenos Aires para rendir homenaje a la joven nación que se ha convertido en el granero del mundo. Los desfiles, las exposiciones y los festejos muestran al planeta que Argentina ha cumplido su destino de grandeza."
 arg_centenario_mayo_1910.f: "«En cien años hemos pasado del desierto a la civilización, de la barbarie al progreso». — Discurso oficial del Centenario."
 arg_centenario_mayo_1910.a: "¡Gloria y honor a la Patria Argentina!"

 # --- Términos y Personajes Nuevos ---
 arg_loc_primer_automovil: "primer automóvil"
 arg_loc_huelga_inquilinos: "Huelga de Inquilinos"
 arg_loc_servicio_militar_obligatorio: "Servicio Militar Obligatorio"
 arg_loc_anarquistas: "anarquistas"
 arg_loc_socialistas: "socialistas"
